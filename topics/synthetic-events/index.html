<!doctype html>
<html>
    <head>
        <title>OWL synthetic events demo</title>
        <style>
            body { font-family: sans-serif; margin: 16px; }
            .toolbar button { margin-right: 8px; padding: 6px 12px; }
            .toolbar button.active { background: #714b67; color: white; }
            .stats { margin: 12px 0; padding: 8px; background: #f3f3f3; font-family: monospace; }
            .grid { display: grid; gap: 1px; background: #ccc; width: max-content; }
            .label { background: #eee; padding: 0 6px; font-size: 11px; display: flex; align-items: center; }
            .cell { width: 18px; height: 18px; background: white; cursor: pointer; }
            .cell:hover { background: #d8c9d4; }
            .cell.selected { background: #714b67; }
            .trap { margin-top: 16px; padding: 12px; border: 2px dashed #c33; width: max-content; }
            .trap button { margin-right: 8px; }
        </style>
    </head>
    <body>
        <script>
            // Spy BEFORE OWL loads: remember every grid cell (class "cell") that
            // got a real "click" listener. Only for learning purposes.
            const cellsWithListener = new Set();
            const origAdd = EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener = function (type, fn, opts) {
                if (type === "click" && this.classList?.contains("cell")) cellsWithListener.add(this);
                return origAdd.call(this, type, fn, opts);
            };
            // how many cells currently on the page have their own click listener
            window.countCellListeners = () =>
                [...cellsWithListener].filter((el) => el.isConnected).length;
        </script>
        <p><a href="../../index.html">Back to topics</a></p>
        <script src="../../lib/owl.iife.js"></script>
        <script type="module" src="./app.js"></script>
    </body>
</html>
